<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="AKSHAT/OS — I build things that should exist.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1b19"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ebe1"/>
      <stop offset="1" stop-color="#e2dacd"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="#f2eee7"/>
  <rect width="1280" height="440" fill="url(#grid)"/>

  <!-- top bar -->
  <g font-family="'IBM Plex Mono','Courier New',monospace" font-size="15" letter-spacing="2.2" fill="#111">
    <path d="M70 34h-10v32h10" fill="none" stroke="#ff5a1f" stroke-width="3"/>
    <text x="80" y="56" font-weight="600">AKSHAT</text>
    <path d="M160 34h10v32h-10" fill="none" stroke="#ff5a1f" stroke-width="3"/>
    <text x="420" y="56"><tspan fill="#ff5a1f">01</tspan> WORK   <tspan fill="#ff5a1f">02</tspan> PLAY   <tspan fill="#ff5a1f">03</tspan> THINK   <tspan fill="#ff5a1f">04</tspan> EXPERIMENT   <tspan fill="#ff5a1f">05</tspan> ABOUT</text>
    <rect x="1080" y="36" width="144" height="28" rx="14" fill="#111"/>
    <circle cx="1100" cy="50" r="5" fill="#d8ff00"/>
    <text x="1114" y="55" font-size="12" fill="#f2eee7" letter-spacing="1.6">CHAOS MODE</text>
  </g>
  <line x1="56" y1="88" x2="1224" y2="88" stroke="#111" stroke-opacity="0.18"/>

  <!-- headline -->
  <g font-family="'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="78" letter-spacing="-3.2" fill="#111">
    <text x="52" y="188">I BUILD THINGS</text>
    <text x="52" y="262">THAT SHOULD</text>
    <text x="52" y="336" fill="#ff5a1f" font-style="italic">EXIST.</text>
  </g>
  <path d="M60 362c40-10 84 6 128-2s86-14 126-4 52 4 70-2" fill="none" stroke="#ff5a1f" stroke-width="5" stroke-linecap="round"/>
  <text x="56" y="404" font-family="'IBM Plex Mono','Courier New',monospace" font-size="14" letter-spacing="2" fill="#66635b">THE PORTFOLIO OF AKSHAT AGRAWAL — A DIGITAL PLAYGROUND</text>

  <!-- cable -->
  <path d="M1176 128c22-34 40-62 104-74" fill="none" stroke="#ff5a1f" stroke-width="10" stroke-linecap="round"/>
  <rect x="1162" y="118" width="26" height="22" rx="5" fill="#111"/>

  <!-- console -->
  <g>
    <rect x="808" y="134" width="420" height="276" rx="38" fill="#111" opacity="0.10" transform="translate(6 14)"/>
    <rect x="808" y="134" width="420" height="276" rx="38" fill="url(#shell)" stroke="#111" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="830" cy="156" r="5" fill="#9a978f"/>
    <circle cx="1206" cy="156" r="5" fill="#9a978f"/>
    <!-- screen -->
    <rect x="838" y="160" width="264" height="168" rx="22" fill="#cfc6b8"/>
    <rect x="850" y="171" width="240" height="146" rx="16" fill="url(#glass)"/>
    <rect x="850" y="171" width="240" height="146" rx="16" fill="url(#glow)"/>
    <g fill="#ff5a1f">
      <rect x="880" y="214" width="10" height="10"/>
      <rect x="880" y="254" width="10" height="10"/>
      <rect x="906" y="204" width="10" height="10"/>
      <rect x="914" y="216" width="10" height="44"/>
      <rect x="906" y="262" width="10" height="10"/>
    </g>
    <g font-family="'VT323','Courier New',monospace" font-size="17" fill="#ff5a1f" letter-spacing="1">
      <text x="948" y="210">&gt; DESIGN_</text>
      <text x="948" y="236">&gt; CODE_</text>
      <text x="948" y="262">&gt; EXPERIMENT_</text>
      <text x="948" y="288">&gt; REPEAT_</text>
    </g>
    <g stroke="#111" stroke-opacity="0.08">
      <line x1="850" y1="190" x2="1090" y2="190"/><line x1="850" y1="230" x2="1090" y2="230"/><line x1="850" y1="270" x2="1090" y2="270"/>
    </g>
    <!-- knob -->
    <g stroke="#111" stroke-width="2.5" stroke-linecap="round">
      <line x1="1162" y1="172" x2="1162" y2="164"/><line x1="1190" y1="200" x2="1198" y2="200"/><line x1="1126" y1="200" x2="1134" y2="200"/>
      <line x1="1182" y1="180" x2="1188" y2="174"/><line x1="1142" y1="180" x2="1136" y2="174"/>
    </g>
    <circle cx="1162" cy="204" r="30" fill="#111"/>
    <circle cx="1162" cy="200" r="27" fill="#ff5a1f"/>
    <ellipse cx="1154" cy="190" rx="10" ry="6" fill="#fff" opacity="0.35"/>
    <!-- switch -->
    <rect x="1128" y="252" width="68" height="28" rx="8" fill="#111"/>
    <rect x="1132" y="256" width="26" height="20" rx="5" fill="#ff5a1f"/>
    <!-- grille -->
    <g fill="#111" opacity="0.55">
      <circle cx="1140" cy="300" r="2.4"/><circle cx="1152" cy="300" r="2.4"/><circle cx="1164" cy="300" r="2.4"/><circle cx="1176" cy="300" r="2.4"/><circle cx="1188" cy="300" r="2.4"/>
      <circle cx="1140" cy="312" r="2.4"/><circle cx="1152" cy="312" r="2.4"/><circle cx="1164" cy="312" r="2.4"/><circle cx="1176" cy="312" r="2.4"/><circle cx="1188" cy="312" r="2.4"/>
    </g>
    <!-- keys -->
    <g>
      <rect x="840" y="344" width="80" height="48" rx="11" fill="#c9c1b4"/>
      <rect x="840" y="340" width="80" height="46" rx="11" fill="#f8f7f3" stroke="#111" stroke-opacity="0.25"/>
      <path d="M880 352l3.5 8.5 8.5 3.5-8.5 3.5-3.5 8.5-3.5-8.5-8.5-3.5 8.5-3.5z" fill="#111"/>
      <rect x="932" y="344" width="80" height="48" rx="11" fill="#c9c1b4"/>
      <rect x="932" y="340" width="80" height="46" rx="11" fill="#f8f7f3" stroke="#111" stroke-opacity="0.25"/>
      <text x="972" y="370" text-anchor="middle" font-family="'IBM Plex Mono','Courier New',monospace" font-size="16" font-weight="700" fill="#111">&lt;/&gt;</text>
      <rect x="1024" y="344" width="80" height="48" rx="11" fill="#c9c1b4"/>
      <rect x="1024" y="340" width="80" height="46" rx="11" fill="#f8f7f3" stroke="#111" stroke-opacity="0.25"/>
      <path d="M1064 352l11 6v12l-11 6-11-6v-12zM1053 358l11 6 11-6M1064 364v12" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>
      <rect x="1116" y="344" width="92" height="48" rx="11" fill="#c2410c"/>
      <rect x="1116" y="340" width="92" height="46" rx="11" fill="#ff5a1f" stroke="#111" stroke-opacity="0.25"/>
      <path d="M1156 352v20l17-10z" fill="#111"/>
    </g>
  </g>
</svg>
